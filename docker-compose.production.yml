services:
  database:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: normbuild
      POSTGRES_USER: normbuild
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env.production}
    volumes:
      - normbuild-production-postgres:/var/lib/postgresql/data
      - ./src/main/resources/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U normbuild -d normbuild"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - private

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - normbuild-production-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - private

  ollama-models:
    image: ollama/ollama:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull llama3.1 && ollama pull nomic-embed-text"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - private

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/normbuild
      DATABASE_USERNAME: normbuild
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env.production}
      NORMBUILD_LLM_ENDPOINT: http://ollama:11434/api/generate
      NORMBUILD_EMBEDDING_ENDPOINT: http://ollama:11434/api/embeddings
      NORMBUILD_MODEL_NAME: llama3.1
      NORMBUILD_EMBEDDING_MODEL_NAME: nomic-embed-text
      NORMBUILD_LLM_TIMEOUT_SECONDS: ${NORMBUILD_LLM_TIMEOUT_SECONDS:-240}
      NORMBUILD_INGESTION_API_KEY: ${NORMBUILD_INGESTION_API_KEY:?Set NORMBUILD_INGESTION_API_KEY in .env.production}
    depends_on:
      database:
        condition: service_healthy
      ollama-models:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      private:
      edge:
        aliases:
          - normbuild-api

volumes:
  normbuild-production-postgres:
  normbuild-production-models:

networks:
  private:
  edge:
    external: true
    name: normbuild-edge
