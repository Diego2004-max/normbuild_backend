server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 40MB
      max-request-size: 42MB
  config:
    import: optional:file:.env[.properties]
  application:
    name: normbuild-api
  mvc:
    async:
      request-timeout: 180000
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5435/normbuild}
    username: ${DATABASE_USERNAME:normbuild}
    password: ${DATABASE_PASSWORD:normbuild}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/init/001-enable-pgvector.sql
        - classpath:db/init/002-create-regulatory-documents.sql

normbuild:
  security:
    ingestion-api-key: ${NORMBUILD_INGESTION_API_KEY:}
  ai:
    embedding-dimensions: 768
    llm-endpoint: ${NORMBUILD_LLM_ENDPOINT:http://localhost:11435/api/generate}
    embedding-endpoint: ${NORMBUILD_EMBEDDING_ENDPOINT:http://localhost:11435/api/embeddings}
    model-name: ${NORMBUILD_MODEL_NAME:llama3.1}
    embedding-model-name: ${NORMBUILD_EMBEDDING_MODEL_NAME:nomic-embed-text}
    similarity-threshold: 0.35
    max-context-results: 5
    embedding-timeout-seconds: ${NORMBUILD_EMBEDDING_TIMEOUT_SECONDS:30}
    llm-timeout-seconds: ${NORMBUILD_LLM_TIMEOUT_SECONDS:240}
    llm-context-tokens: ${NORMBUILD_LLM_CONTEXT_TOKENS:4096}
    llm-max-output-tokens: ${NORMBUILD_LLM_MAX_OUTPUT_TOKENS:512}
    model-keep-alive: ${NORMBUILD_MODEL_KEEP_ALIVE:10m}
