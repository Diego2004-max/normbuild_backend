services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: normbuild
      POSTGRES_USER: normbuild
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-normbuild}
    ports:
      - "5432:5432"
    volumes:
      - normbuild-postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U normbuild -d normbuild"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  normbuild-postgres-data:
