name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Ensure secret environment files are not tracked
        run: |
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -Ev '(^|/)\.env\.(example|production\.example)$' || true)"
          if [ -n "$tracked_env_files" ]; then
            echo "Unexpected tracked environment files: $tracked_env_files"
            exit 1
          fi
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Validate production compose configuration
        env:
          DATABASE_PASSWORD: ci-only-database-secret
          NORMBUILD_INGESTION_API_KEY: ci-only-ingestion-secret
        run: docker compose -f docker-compose.production.yml config --quiet
      - name: Build backend container
        run: docker build --tag normbuild-backend:ci .
