services:
  - type: web
    name: normbuild-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: normbuild-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: normbuild-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: normbuild-db
          property: password
      - key: NORMBUILD_ALLOWED_ORIGINS
        value: https://normbuild-frontend.vercel.app
      - key: NORMBUILD_INGESTION_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NORMBUILD_HOSTED_MODEL
        value: openai/gpt-oss-20b
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: NORMBUILD_LLM_ENDPOINT
        value: http://127.0.0.1:11435/api/generate
      - key: NORMBUILD_EMBEDDING_ENDPOINT
        value: http://127.0.0.1:11435/api/embeddings
      - key: NORMBUILD_EMBEDDINGS_ENABLED
        value: "false"
      - key: NORMBUILD_MODEL_NAME
        value: llama3.1
      - key: NORMBUILD_EMBEDDING_MODEL_NAME
        value: nomic-embed-text
      - key: NORMBUILD_LLM_TIMEOUT_SECONDS
        value: "240"

databases:
  - name: normbuild-db
    plan: free
    databaseName: normbuild
    user: normbuild
    postgresMajorVersion: "16"
